    <!-- Disable pinch-to-zoom on mobile/touch devices only without affecting desktop zoom -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var isTouch = 'ontouchstart' in window || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
        if (!isTouch) return;

        // Prevent multi-touch pinch zoom
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent Safari iOS gesture zoom
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        });
        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        });
        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        });

        // Prevent rapid double-tap zoom on mobile
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
